<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gann4Life — Under maintenance</title>
<meta name="description" content="The Gann4Life portfolio is being rebuilt. Find me on Linksta in the meantime.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308080b'/%3E%3Ctext x='32' y='43' font-family='sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%237c6cff'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root { --bg: #08080b; --fg: #f2f2f5; --muted: #8d8d9c; --accent: #7c6cff; }
@media (prefers-color-scheme: light) { :root { --bg: #f7f7f9; --fg: #111116; --muted: #5d5d6b; --accent: #5a48f0; } }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 32rem; text-align: center; }
p.kicker { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; }
h1 { margin: 0.75rem 0 1rem; font-size: clamp(2.25rem, 1.5rem + 4vw, 3.5rem); line-height: 1.05; letter-spacing: -0.02em; }
p.lead { color: var(--muted); }
a.button { display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 2rem; padding: 0 1.5rem; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
a.button:hover, a.button:focus-visible { filter: brightness(1.15); }
a.button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<p class="kicker">Gann4Life</p>
<h1>Under maintenance</h1>
<p class="lead">The portfolio is being rebuilt. In the meantime, you can find my work and contact links here:</p>
<a class="button" href="https://linksta.cc/@mrgann" rel="me">linksta.cc/@mrgann</a>
</main>
</body>
</html>
